# Goes inside the `server { listen 443 ssl; server_name hudsonshi.com; ... }` block
# of /etc/nginx/sites-enabled/hudsonshi.conf. The container listens on 127.0.0.1:3100
# and is built with basePath=/fcpp, so the path is passed through unchanged.
# (Next.js redirects /fcpp/ to /fcpp, so both forms must reach it; do not redirect in nginx.)
location ~ ^/fcpp(/|$) {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
